<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PracticarL · Spanish every day</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172c2a;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;background:#176f61;color:white}button:hover{filter:brightness(.95)}button:disabled{opacity:.5;cursor:default}.secondary{background:#e7eeea;color:#21574d}.ghost{background:transparent;color:#176f61}.wrap{max-width:850px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:1.35rem;font-weight:800;color:#176f61}.card{background:white;border:1px solid #e0e9e3;border-radius:18px;padding:23px;margin:16px 0;box-shadow:0 2px 8px #183b2a0b}.muted{color:#62746d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.grid .card{margin:0}input{width:100%;border:1px solid #cbd9d0;border-radius:12px;padding:13px;margin:9px 0 14px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.bubble{max-width:83%;padding:13px 16px;border-radius:16px;margin:12px 0;background:#eaf0ed;white-space:pre-wrap}.bubble.user{margin-left:auto;background:#d9eee7}.line{border-top:1px solid #e4ebe6;padding:14px 0}.small{font-size:.88rem}.pill{display:inline-block;background:#e6f2ec;border-radius:20px;padding:5px 10px;font-size:.8rem;color:#176f61}.actions{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none}h1{font-size:2rem;margin-bottom:8px}h2{margin-top:0}details{margin:12px 0}summary{cursor:pointer;color:#176f61}.familiarity-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:9px;vertical-align:middle;border:1px solid #0002}.familiarity-dot.red{background:#d74747}.familiarity-dot.yellow{background:#e5b82d}.familiarity-dot.green{background:#26966b}.vocab-filter{width:100%;padding:12px;border:1px solid #cbd9d0;border-radius:12px;background:white;margin:10px 0}textarea{width:100%;min-height:90px;border:1px solid #cbd9d0;border-radius:12px;padding:12px;font:inherit} .notice{background:#fff6df;border-radius:12px;padding:12px;color:#665322}
</style></head><body><main class="wrap"><header class="top"><div class="logo">✦ PracticarL</div><div id="who"></div></header><div id="app"></div></main>
<script src="conversation-engine.js"></script>
<script>
const starters=[
{q:"¡Hola! ¿Qué te gusta hacer los fines de semana?",en:"Hi! What do you like to do on weekends?",follow:"¡Qué interesante! ¿Con quién sueles hacerlo?",fe:"How interesting! Who do you usually do that with?"},
{q:"Buenos días. ¿Qué desayunaste hoy?",en:"Good morning. What did you have for breakfast today?",follow:"¡Qué rico! ¿Te gusta cocinar?",fe:"Sounds tasty! Do you like cooking?"},
{q:"Estoy pensando en viajar. ¿Qué lugar me recomiendas?",en:"I'm thinking of traveling. What place do you recommend?",follow:"¡Buena idea! ¿Qué puedo hacer allí?",fe:"Good idea! What can I do there?"},
{q:"¡Hola! ¿Cómo estuvo tu día?",en:"Hi! How was your day?",follow:"Cuéntame un poco más. ¿Qué fue lo mejor?",fe:"Tell me a bit more. What was the best part?"},
{q:"¿Qué tipo de música te gusta escuchar?",en:"What kind of music do you like to listen to?",follow:"¡Genial! ¿Tienes un artista favorito?",fe:"Great! Do you have a favorite artist?"},
{q:"¿Prefieres el café o el té? ¿Por qué?",en:"Do you prefer coffee or tea? Why?",follow:"Entiendo. ¿Lo tomas todos los días?",fe:"I see. Do you drink it every day?"}
];
const words=[["house","casa"],["water","agua"],["book","libro"],["window","ventana"],["friend","amigo"],["food","comida"],["street","calle"],["time","tiempo"],["day","día"],["night","noche"],["work","trabajo"],["school","escuela"],["chair","silla"],["table","mesa"],["door","puerta"],["city","ciudad"],["dog","perro"],["cat","gato"],["bread","pan"],["apple","manzana"],["happy","feliz"],["small","pequeño"],["big","grande"],["red","rojo"],["green","verde"],["morning","mañana"],["evening","tarde"],["family","familia"],["music","música"],["rain","lluvia"],["sun","sol"],["tree","árbol"],["car","coche|carro|auto"],["computer","computadora|ordenador"],["to eat","comer"],["to speak","hablar"],["to learn","aprender"],["to write","escribir"],["to read","leer"],["to go","ir"]];
let user=localStorage.getItem("practicarl-current")||"",state=null,session=null,quiz=null;
const AI_ENDPOINT="https://practicarl-api.tcoan98.workers.dev/fallback";
const app=document.getElementById("app"),who=document.getElementById("who");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=()=>"practicarl-user-"+user;
const blank=()=>({conversations:[],quizzes:[],active:null,level:1,lastScenario:null,aiEnabled:false,vocabulary:[]});
function save(){localStorage.setItem(key(),JSON.stringify(state))}
function load(){try{state=JSON.parse(localStorage.getItem(key()))||blank()}catch{state=blank()}state.conversations ||= [];state.quizzes ||= [];state.vocabulary ||= [];state.active ||= null;state.level ||= 1;state.level=Math.max(1,Math.min(8,state.level));state.completedAtLevel ||= 0;state.aiEnabled ??= false}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function login(){who.innerHTML="";app.innerHTML='<section class="card"><h1>Welcome to PracticarL</h1><p class="muted">A little Spanish, every day. Enter a username to continue.</p><form id="login"><label>Username<input id="name" maxlength="35" autocomplete="nickname" required placeholder="Your username"></label><button>Continue</button></form><p class="small muted">No password needed. Progress is stored only in this browser. Anyone using the same browser and username can access it.</p></section>';document.getElementById("login").onsubmit=e=>{e.preventDefault();user=document.getElementById("name").value.trim();if(!user)return;localStorage.setItem("practicarl-current",user);load();home()}}
function shell(title,body){who.innerHTML='<span class="small">'+esc(user)+'</span> <button class="ghost" id="switch">Switch user</button>';app.innerHTML='<nav><button class="secondary" id="home">Home</button><button class="secondary" id="history">History</button><button class="secondary" id="vocabulary">My Vocabulary</button><button class="secondary" id="progress">Progress</button></nav><h1>'+title+'</h1>'+body;document.getElementById("switch").onclick=()=>{user="";localStorage.removeItem("practicarl-current");login()};document.getElementById("home").onclick=home;document.getElementById("history").onclick=history;document.getElementById("vocabulary").onclick=showVocabulary;document.getElementById("progress").onclick=progress}
function home(){session=null;quiz=null;let sc=PracticarEngine.choose(state.level||1,state.lastScenario);state.lastScenario=sc.id;save();shell("¡Hola, "+esc(user)+"!",'<p class="muted">'+esc(sc.label)+'. '+esc(sc.guide)+'</p><div class="grid"><section class="card"><span class="pill">Conversation</span><h2>Start talking</h2><p>'+esc(sc.q)+'</p><button id="talk">Start conversation</button></section><section class="card"><span class="pill">Vocabulary</span><h2>Vocabulary challenge</h2><p>Practice Spanish words and expressions at your own pace.</p><button id="quiz">Start quiz</button></section></div>'+(state.active?'<section class="card"><p>You have an unfinished conversation.</p><button id="resume">Resume conversation</button></section>':""));state.aiEnabled=true;save();testGeminiConnection();document.getElementById("talk").onclick=()=>startConversation(sc);document.getElementById("quiz").onclick=chooseQuiz;if(state.active)document.getElementById("resume").onclick=()=>{session=state.active;renderConversation()}}
async function testGeminiConnection(){const heading=app.querySelector("h1");if(!heading)return;const cacheKey="practicarl_gemini_greeting_v1";const applyGreeting=answer=>{if(!heading.isConnected)return;const greeting=String(answer||"").trim().replace(/[.!¡!]+$/g,"").trim();if(greeting&&greeting.length<70&&/^[\\p{L}\\p{M}\\s¡!¿?.,-]+$/u.test(greeting))heading.textContent=greeting.replace(/^¡/,"").replace(/^./,c=>c.toLocaleUpperCase("es"))+", "+user+"!"};let cached="";try{cached=localStorage.getItem(cacheKey)||""}catch(e){}if(cached){applyGreeting(cached);return}const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),16000);try{const response=await fetch("https://practicarl-api.tcoan98.workers.dev/test-gemini",{method:"POST",signal:controller.signal});const data=await response.json().catch(()=>({}));if(!data.ok||!data.answer)return;const greeting=String(data.answer).trim();if(greeting&&greeting.length<70&&/^[\\p{L}\\p{M}\\s¡!¿?.,-]+$/u.test(greeting)){try{localStorage.setItem(cacheKey,greeting)}catch(e){}applyGreeting(greeting)}}catch(e){}finally{clearTimeout(timer)}}
function startConversation(sc){session={date:new Date().toISOString(),scenarioId:sc.id,level:sc.level,starter:{q:sc.q,en:sc.en},messages:[{role:"assistant",text:sc.q,en:sc.en}],turns:0,repair:null,clarifications:0,complete:false};state.active=session;save();renderConversation()}
async function aiFallback(mode,text,word){if(!state.aiEnabled)return {ok:false,reason:"AI disabled"};try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),24000);let response;try{response=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode,message:text,word:word||"",level:session.level||1,prompt:session.starter.q,history:session.messages.slice(-7).map(m=>({role:m.role,text:m.text}))}),signal:controller.signal})}finally{clearTimeout(timer)}let data=await response.json().catch(()=>({}));if(!response.ok){const reason=data.code==="WORKER_DAILY_LIMIT"?"PracticarL's daily request limit has been reached. Please try tomorrow.":data.code==="GEMINI_QUOTA"?"Gemini's usage quota has been reached. Please try again later.":data.code==="GEMINI_UNAVAILABLE"?"Gemini is temporarily busy. Please try again shortly.":response.status===429?"An AI request limit was reached. Please try again later.":data.error||"Connection error (HTTP "+response.status+")";return {ok:false,reason}}if(typeof data.reply!=="string"||!data.reply.trim())return {ok:false,reason:"Invalid AI response"};return {ok:true,data}}catch(e){return {ok:false,reason:e.name==="AbortError"?"AI request timed out. Please try again.":"Connection failed. Please try again."}}}

<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172c2a;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;background:#176f61;color:white}button:hover{filter:brightness(.95)}button:disabled{opacity:.5;cursor:default}.secondary{background:#e7eeea;color:#21574d}.ghost{background:transparent;color:#176f61}.wrap{max-width:850px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:1.35rem;font-weight:800;color:#176f61}.card{background:white;border:1px solid #e0e9e3;border-radius:18px;padding:23px;margin:16px 0;box-shadow:0 2px 8px #183b2a0b}.muted{color:#62746d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.grid .card{margin:0}input{width:100%;border:1px solid #cbd9d0;border-radius:12px;padding:13px;margin:9px 0 14px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.bubble{max-width:83%;padding:13px 16px;border-radius:16px;margin:12px 0;background:#eaf0ed;white-space:pre-wrap}.bubble.user{margin-left:auto;background:#d9eee7}.line{border-top:1px solid #e4ebe6;padding:14px 0}.small{font-size:.88rem}.pill{display:inline-block;background:#e6f2ec;border-radius:20px;padding:5px 10px;font-size:.8rem;color:#176f61}.actions{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none}h1{font-size:2rem;margin-bottom:8px}h2{margin-top:0}details{margin:12px 0}summary{cursor:pointer;color:#176f61}.familiarity-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:9px;vertical-align:middle;border:1px solid #0002}.familiarity-dot.red{background:#d74747}.familiarity-dot.yellow{background:#e5b82d}.familiarity-dot.green{background:#26966b}.vocab-filter{width:100%;padding:12px;border:1px solid #cbd9d0;border-radius:12px;background:white;margin:10px 0}textarea{width:100%;min-height:90px;border:1px solid #cbd9d0;border-radius:12px;padding:12px;font:inherit} </style></head><body><main class="wrap"><header class="top"><div class="logo">✦ PracticarL</div><div id="who"></div></header><div id="app"></div></main>
<script src="conversation-engine.js"></script>
<script>
const starters=[
{q:"¡Hola! ¿Qué te gusta hacer los fines de semana?",en:"Hi! What do you like to do on weekends?",follow:"¡Qué interesante! ¿Con quién sueles hacerlo?",fe:"How interesting! Who do you usually do that with?"},
{q:"Buenos días. ¿Qué desayunaste hoy?",en:"Good morning. What did you have for breakfast today?",follow:"¡Qué rico! ¿Te gusta cocinar?",fe:"Sounds tasty! Do you like cooking?"},
{q:"Estoy pensando en viajar. ¿Qué lugar me recomiendas?",en:"I'm thinking of traveling. What place do you recommend?",follow:"¡Buena idea! ¿Qué puedo hacer allí?",fe:"Good idea! What can I do there?"},
{q:"¡Hola! ¿Cómo estuvo tu día?",en:"Hi! How was your day?",follow:"Cuéntame un poco más. ¿Qué fue lo mejor?",fe:"Tell me a bit more. What was the best part?"},
{q:"¿Qué tipo de música te gusta escuchar?",en:"What kind of music do you like to listen to?",follow:"¡Genial! ¿Tienes un artista favorito?",fe:"Great! Do you have a favorite artist?"},
{q:"¿Prefieres el café o el té? ¿Por qué?",en:"Do you prefer coffee or tea? Why?",follow:"Entiendo. ¿Lo tomas todos los días?",fe:"I see. Do you drink it every day?"}
];
const words=[["house","casa"],["water","agua"],["book","libro"],["window","ventana"],["friend","amigo"],["food","comida"],["street","calle"],["time","tiempo"],["day","día"],["night","noche"],["work","trabajo"],["school","escuela"],["chair","silla"],["table","mesa"],["door","puerta"],["city","ciudad"],["dog","perro"],["cat","gato"],["bread","pan"],["apple","manzana"],["happy","feliz"],["small","pequeño"],["big","grande"],["red","rojo"],["green","verde"],["morning","mañana"],["evening","tarde"],["family","familia"],["music","música"],["rain","lluvia"],["sun","sol"],["tree","árbol"],["car","coche|carro|auto"],["computer","computadora|ordenador"],["to eat","comer"],["to speak","hablar"],["to learn","aprender"],["to write","escribir"],["to read","leer"],["to go","ir"]];
let user=localStorage.getItem("practicarl-current")||"",state=null,session=null,quiz=null,grammarSession=null;
const AI_ENDPOINT="https://practicarl-api.tcoan98.workers.dev/fallback";
const app=document.getElementById("app"),who=document.getElementById("who");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=()=>"practicarl-user-"+user;
const blank=()=>({conversations:[],quizzes:[],active:null,level:1,lastScenario:null,aiEnabled:false,vocabulary:[],grammarAttempts:[]});
function save(){localStorage.setItem(key(),JSON.stringify(state))}
function load(){try{state=JSON.parse(localStorage.getItem(key()))||blank()}catch{state=blank()}state.conversations ||= [];state.quizzes ||= [];state.vocabulary ||= [];state.grammarAttempts ||= [];state.active ||= null;state.level ||= 1;state.level=Math.max(1,Math.min(8,state.level));state.completedAtLevel ||= 0;state.aiEnabled ??= false}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function login(){who.innerHTML="";app.innerHTML='<section class="card"><h1>Welcome to PracticarL</h1><p class="muted">A little Spanish, every day. Enter a username to continue.</p><form id="login"><label>Username<input id="name" maxlength="35" autocomplete="nickname" required placeholder="Your username"></label><button>Continue</button></form><p class="small muted">No password needed. Progress is stored only in this browser. Anyone using the same browser and username can access it.</p></section>';document.getElementById("login").onsubmit=e=>{e.preventDefault();user=document.getElementById("name").value.trim();if(!user)return;localStorage.setItem("practicarl-current",user);load();home()}}
function shell(title,body){who.innerHTML='<span class="small">'+esc(user)+'</span> <button class="ghost" id="switch">Switch user</button>';app.innerHTML='<nav><button class="secondary" id="home">Home</button><button class="secondary" id="history">History</button><button class="secondary" id="vocabulary">My Vocabulary</button><button class="secondary" id="grammar">Grammar practice</button><button class="secondary" id="progress">Progress</button></nav><h1>'+title+'</h1>'+body;document.getElementById("switch").onclick=()=>{user="";localStorage.removeItem("practicarl-current");login()};document.getElementById("home").onclick=home;document.getElementById("history").onclick=history;document.getElementById("vocabulary").onclick=showVocabulary;document.getElementById("grammar").onclick=showGrammar;document.getElementById("progress").onclick=progress}
function home(){session=null;quiz=null;let sc=PracticarEngine.choose(state.level||1,state.lastScenario);state.lastScenario=sc.id;save();shell("¡Hola, "+esc(user)+"!",'<p class="muted">'+esc(sc.label)+'. '+esc(sc.guide)+'</p><div class="grid"><section class="card"><span class="pill">Conversation</span><h2>Start talking</h2><p>'+esc(sc.q)+'</p><button id="talk">Start conversation</button></section><section class="card"><span class="pill">Vocabulary</span><h2>Vocabulary challenge</h2><p>Practice Spanish words and expressions at your own pace.</p><button id="quiz">Start quiz</button></section><section class="card"><span class="pill">Grammar</span><h2>Practice your sentences</h2><p>Translate short phrases inspired by your conversations.</p><button id="grammar-home">Practice grammar</button></section></div>'+(state.active?'<section class="card"><p>You have an unfinished conversation.</p><button id="resume">Resume conversation</button></section>':""));state.aiEnabled=true;save();testGeminiConnection();document.getElementById("talk").onclick=()=>startConversation(sc);document.getElementById("quiz").onclick=chooseQuiz;document.getElementById("grammar-home").onclick=showGrammar;if(state.active)document.getElementById("resume").onclick=()=>{session=state.active;renderConversation()}}
async function testGeminiConnection(){const heading=app.querySelector("h1");if(!heading)return;const key="practicarl_greeting_cache";const apply=answer=>{if(!heading.isConnected)return;const greeting=String(answer||"").trim().replace(/[.!¡]+$/g,"").trim();if(greeting&&greeting.length<70&&/^[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ¡¿ ,.!?-]+$/.test(greeting))heading.textContent=greeting.replace(/^¡/,"").replace(/^./,c=>c.toLocaleUpperCase("es"))+", "+user+"!"};let cached="";try{cached=localStorage.getItem(key)||""}catch(e){}if(cached){apply(cached);return}const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),16000);try{const response=await fetch("https://practicarl-api.tcoan98.workers.dev/test-gemini",{method:"POST",signal:controller.signal});const data=await response.json().catch(()=>({}));if(data.ok&&data.answer){apply(data.answer);try{localStorage.setItem(key,String(data.answer))}catch(e){}}}catch(e){}finally{clearTimeout(timer)}}
function startConversation(sc){session={date:new Date().toISOString(),scenarioId:sc.id,level:sc.level,starter:{q:sc.q,en:sc.en},messages:[{role:"assistant",text:sc.q,en:sc.en}],turns:0,repair:null,clarifications:0,complete:false};state.active=session;save();renderConversation()}
async function aiFallback(mode,text,word){if(!state.aiEnabled)return {ok:false,reason:"AI disabled"};try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),24000);let response;try{response=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode,message:text,word:word||"",level:session.level||1,prompt:session.starter.q,history:session.messages.slice(-7).map(m=>({role:m.role,text:m.text}))}),signal:controller.signal})}finally{clearTimeout(timer)}let data=await response.json().catch(()=>({}));if(!response.ok)return {ok:false,reason:data.code==="WORKER_DAILY_LIMIT"?"PracticarL daily request limit reached. Try again tomorrow.":data.code==="GEMINI_QUOTA"?"Gemini usage quota reached. Try again later.":data.code==="GEMINI_UNAVAILABLE"?"Gemini is temporarily busy. Try again shortly.":data.error||"HTTP "+response.status};if(typeof data.reply!=="string"||!data.reply.trim())return {ok:false,reason:"Invalid AI response"};return {ok:true,data}}catch(e){return {ok:false,reason:e.name==="AbortError"?"AI request timed out":"Connection failed"}}}
async function reply(text){let t=text.trim();if(!t||session.sending)return;session.sending=true;let button=document.querySelector('#respond button[type="submit"],#respond button:not([type])');if(button){button.disabled=true;button.textContent="Thinking…"}session.messages.push({role:"user",text:t,en:null});
let outcome=await aiFallback("continue",t,session.repair?.word),r=null;
if(outcome.ok){let ai=outcome.data;session.repair=null;session.turns++;session.aiTurns=(session.aiTurns||0)+1;session.aiStatus="Gemini connected";if(ai.suggestion)session.discoveries=(session.discoveries||[]).concat([{word:"described word",translation:ai.suggestion}]);r={kind:ai.end?"end":"continue",reply:{text:ai.reply,en:ai.en}}}
else if(state.aiEnabled){session.messages.pop();session.sending=false;session.aiStatus=outcome.reason+" Your message was not sent. Please try again.";state.active=session;save();renderConversation();return}
else{session.aiStatus="Offline practice";r=PracticarEngine.respond(session,t);if(r.kind==="repair"){session.repair={word:r.word,entry:r.entry};session.clarifications++}else if(r.kind==="repair-solved"){session.repair=null;session.discoveries=(session.discoveries||[]).concat([{word:r.word,translation:r.translation}])}else if(r.kind==="clarify"){session.clarifications++}else if(r.kind==="continue"){session.turns++}}
session.messages.push({role:"assistant",text:r.reply.text,en:r.reply.en});session.sending=false;if(r.kind==="end"){finishConversation();return}state.active=session;save();renderConversation()}
async function finishConversation(){if(session.complete)return;session.complete=true;session.reviewPending=!!state.aiEnabled&&session.messages.some(m=>m.role==="user");state.completedAtLevel=state.completedAtLevel||0;if(session.turns>=2){state.completedAtLevel++;if(state.completedAtLevel>=3){state.level=Math.min(8,(state.level||1)+1);state.completedAtLevel=0}}session.feedback="Thanks for practicing! Come back whenever you feel like chatting.";state.conversations.unshift(session);state.active=null;save();renderConversation();if(session.reviewPending){const completed=session;try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);let response;try{response=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"review",message:"Review this completed conversation.",level:completed.level||1,prompt:completed.starter.q,history:completed.messages.slice(-16).map(m=>({role:m.role,text:m.text}))}),signal:controller.signal})}finally{clearTimeout(timer)}const data=await response.json().catch(()=>({}));if(!response.ok||!data.review)throw Error(data.error||"Review unavailable");completed.review=data.review;saveReviewVocabulary(completed.review)}catch(e){completed.reviewError="AI review unavailable: "+(e.name==="AbortError"?"request timed out":e.message)+". Your conversation is saved."}finally{completed.reviewPending=false;save();if(session===completed&&completed.complete)renderConversation()}}}
function renderConversation(){let messages=session.messages.map(m=>'<div class="bubble '+(m.role==="user"?"user":"")+'"><span class="small muted">'+(m.role==="user"?"You":"PracticarL")+'</span><div>'+esc(m.text)+'</div>'+(m.en?'<details><summary>English translation</summary>'+esc(m.en)+'</details>':"")+'</div>').join("");shell("Conversation",'<section class="card">'+(session.aiStatus?'<p class="notice" role="status">'+esc(session.aiStatus)+'</p>':'')+messages+(session.complete?'<div class="notice"><strong>Conversation complete</strong><p>'+esc((session.feedback||'Thanks for practicing!').replace(/Practice step:\s*\d+\/8\.?/gi,'').trim()||'Thanks for practicing!')+'</p></div>'+(session.reviewPending?'<p role="status">Reviewing your Spanish…</p>':session.review?'<section class="card"><h3>Your Spanish review</h3><p>'+esc(session.review.summary)+'</p><p><strong>What you did well:</strong> '+esc(session.review.strength)+'</p>'+(session.review.corrections||[]).map(c=>'<p><strong>You wrote:</strong> '+esc(c.original)+'<br><strong>Try:</strong> '+esc(c.corrected)+'<br>'+esc(c.explanation)+'</p>').join('')+'<p><strong>Next time:</strong> '+esc(session.review.nextStep)+'</p></section>':session.reviewError?'<p role="status">'+esc(session.reviewError)+'</p>':'')+'<button id="done">Back home</button>':'<form id="respond"><label for="response">'+(session.repair&&!state.aiEnabled?"Describe the word in Spanish":"Your reply in Spanish")+'</label><textarea id="response" required placeholder="Escribe tu respuesta..."></textarea><div class="actions"><button>Send reply</button>'+(session.repair&&!state.aiEnabled?'<button type="button" class="secondary" id="skip">Skip this word</button>':'')+'<button type="button" class="secondary" id="finish">End conversation</button></div></form>')+'</section>');if(session.complete)document.getElementById("done").onclick=home;else{document.getElementById("respond").onsubmit=e=>{e.preventDefault();reply(document.getElementById("response").value)};document.getElementById("finish").onclick=finishConversation;if(session.repair&&!state.aiEnabled)document.getElementById("skip").onclick=()=>{session.repair=null;session.messages.push({role:"assistant",text:"No pasa nada. Volvamos a la conversación. ¿Puedes responder a la pregunta anterior?",en:"No problem. Let's return to the conversation. Can you answer the previous question?"});save();renderConversation()}}}
function saveReviewVocabulary(review){state.vocabulary ||= [];for(const v of review.vocabulary||[]){if(!v.spanish||!v.english)continue;const k=normalize(v.spanish);if(!state.vocabulary.some(x=>normalize(x.spanish)===k))state.vocabulary.push({...v,familiarity:0,added:new Date().toISOString()})}save()}
let vocabularyFilter="all";function familiarityGroup(v){return Number(v.familiarity)>=3?"green":Number(v.familiarity)>=2?"yellow":"red"}function showVocabulary(){const entries=state.vocabulary||[];const shown=entries.map((v,i)=>({v,i})).filter(({v})=>vocabularyFilter==="all"||familiarityGroup(v)===vocabularyFilter);shell("My Vocabulary",'<section class="card"><h2>Saved words and phrases</h2><p class="muted">Words and phrases from your conversation reviews are saved here automatically.</p><button id="practice-vocab">Quiz my vocabulary</button></section><section class="card"><label for="vocab-filter"><strong>Filter by familiarity</strong></label><select class="vocab-filter" id="vocab-filter"><option value="all">All words ('+entries.length+')</option><option value="red">🔴 Difficult / not yet rated ('+entries.filter(v=>familiarityGroup(v)==="red").length+')</option><option value="yellow">🟡 Familiar ('+entries.filter(v=>familiarityGroup(v)==="yellow").length+')</option><option value="green">🟢 I know this one ('+entries.filter(v=>familiarityGroup(v)==="green").length+')</option></select></section>'+(shown.length?shown.map(({v,i})=>'<section class="card"><h3><span class="familiarity-dot '+familiarityGroup(v)+'" aria-label="'+(familiarityGroup(v)==="green"?"I know this one":familiarityGroup(v)==="yellow"?"Familiar":"Difficult or not yet rated")+'"></span>'+esc(v.spanish)+' <span class="pill">'+esc(v.type||"word")+'</span></h3><p><strong>'+esc(v.english)+'</strong></p>'+(v.infinitive?'<p>Infinitive: '+esc(v.infinitive)+'</p>':'')+(v.example?'<p><em>'+esc(v.example)+'</em></p>':'')+(v.note?'<p class="muted">'+esc(v.note)+'</p>':'')+(v.conjugations&&Object.keys(v.conjugations).length?'<details><summary>Present-tense conjugations</summary>'+Object.entries(v.conjugations).map(([p,form])=>'<div class="line">'+esc(({yo:"yo",tu:"tú",el:"él/ella/usted",nosotros:"nosotros",ellos:"ellos/ellas/ustedes"})[p]||p)+': <strong>'+esc(form)+'</strong></div>').join('')+'</details>':'')+'<button class="secondary" data-remove-vocab="'+i+'">Remove</button></section>').join(''):'<section class="card"><p>'+(entries.length?'No words match this filter.':'No saved vocabulary yet. Finish a conversation to get recommendations.')+'</p></section>'));document.getElementById("vocab-filter").value=vocabularyFilter;document.getElementById("vocab-filter").onchange=e=>{vocabularyFilter=e.target.value;showVocabulary()};document.querySelectorAll("[data-remove-vocab]").forEach(b=>b.onclick=()=>{state.vocabulary.splice(Number(b.dataset.removeVocab),1);save();showVocabulary()});document.getElementById("practice-vocab").onclick=()=>startQuiz("personal")}
function grammarExercises(){return (state.conversations||[]).flatMap((c,i)=>(c.review?.exercises||[]).filter(x=>x.english&&x.spanish).map((x,j)=>({...x,source:i,id:(c.date||i)+":"+j})))}
function showGrammar(message=""){const exercises=grammarExercises(),unreviewed=state.conversations.filter(c=>c.messages?.some(m=>m.role==="user")&&!c.review?.exercises);const categories={};for(const e of exercises)categories[e.category||"Grammar"]=(categories[e.category||"Grammar"]||0)+1;shell("Grammar practice",'<section class="card"><h2>Practice what comes up in conversation</h2><p>Translate English sentences into Spanish, then compare your answer with a suggested translation and its grammar explanation. Different natural translations can also be correct.</p>'+(message?'<p class="notice" role="status">'+esc(message)+'</p>':'')+(exercises.length?'<button id="start-grammar">Practice sentences</button><p class="muted small">'+exercises.length+' practice sentences saved from your conversations.</p>':'<p class="muted">No grammar exercises saved yet. Complete a conversation or analyze past conversations to collect some.</p>')+'</section><section class="card"><h2>Patterns to practice</h2>'+(Object.keys(categories).length?Object.entries(categories).map(([name,count])=>'<div class="line">'+esc(name)+' <span class="pill">'+count+'</span></div>').join(''):'<p class="muted">Grammar patterns will appear here as conversations are reviewed.</p>')+'</section>'+(unreviewed.length?'<section class="card"><h2>Analyze past conversations</h2><p>Review saved conversations for grammar mistakes and generate new practice sentences. This sends conversation text to Gemini only when you choose to analyze it.</p><button id="analyze-grammar">Analyze past conversations ('+unreviewed.length+')</button></section>':''));const start=document.getElementById("start-grammar");if(start)start.onclick=()=>{grammarSession={questions:shuffle(exercises).slice(0,8),index:0,answers:[]};renderGrammar()};const analyze=document.getElementById("analyze-grammar");if(analyze)analyze.onclick=analyzeGrammarHistory}
async function analyzeGrammarHistory(){const pending=state.conversations.filter(c=>c.messages?.some(m=>m.role==="user")&&!c.review?.exercises).slice(0,3);if(!pending.length)return showGrammar();shell("Analyzing conversations",'<section class="card"><p id="analysis-status" role="status">Reviewing saved conversations…</p></section>');let done=0,errors=[];for(const c of pending){const status=document.getElementById("analysis-status");if(status)status.textContent="Analyzing conversation "+(done+1)+" of "+pending.length+"…";try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),28000);let response;try{response=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"review",message:"Identify genuine grammar mistakes and produce English-to-Spanish practice exercises.",level:c.level||1,prompt:String(c.starter?.q||"").slice(0,300),history:c.messages.slice(-16).map(m=>({role:m.role,text:m.text}))}),signal:controller.signal})}finally{clearTimeout(timer)}const data=await response.json().catch(()=>({}));if(!response.ok||!data.review)throw Error(data.error||"Review unavailable");c.review=data.review;c.reviewError=null;saveReviewVocabulary(c.review);done++}catch(e){errors.push(e.name==="AbortError"?"Request timed out":e.message);break}}save();showGrammar(done+" conversation"+(done===1?"":"s")+" analyzed."+(errors.length?" Could not finish: "+errors[0]:"")+(state.conversations.some(c=>c.messages?.some(m=>m.role==="user")&&!c.review?.exercises)?" You can analyze more later.":""))}
function renderGrammar(){if(!grammarSession)return showGrammar();const g=grammarSession;if(g.index>=g.questions.length){const confident=g.answers.filter(a=>a.confident).length;grammarSession=null;showGrammar("Practice complete. You felt confident about "+confident+" of "+g.answers.length+" translations.");return}const q=g.questions[g.index];shell("Grammar practice",'<section class="card"><span class="pill">'+esc(q.category||"Grammar")+'</span><p class="muted">Translate this into Spanish:</p><h2>'+esc(q.english)+'</h2><form id="grammar-answer"><label for="grammar-text">Your Spanish translation</label><textarea id="grammar-text" required autocomplete="off" placeholder="Escribe tu traducción..."></textarea><button>Check translation</button></form></section>');document.getElementById("grammar-answer").onsubmit=e=>{e.preventDefault();const answer=document.getElementById("grammar-text").value.trim();if(!answer)return;const matches=normalize(answer.replace(/[¿?¡!.,;:]/g,""))===normalize(q.spanish.replace(/[¿?¡!.,;:]/g,""));shell("Grammar practice",'<section class="card"><span class="pill">'+esc(q.category||"Grammar")+'</span><p><strong>You wrote:</strong> '+esc(answer)+'</p><p><strong>Suggested translation:</strong> '+esc(q.spanish)+'</p>'+(matches?'<p class="muted">Your answer matches the suggested translation.</p>':'<p class="muted">Other natural translations may also be correct. Compare the meaning and grammar before rating yourself.</p>')+'<p>'+esc(q.rule||"")+'</p><p>Did you apply the grammar correctly?</p><div class="actions"><button id="grammar-yes">Yes, I got it</button><button class="secondary" id="grammar-no">I need more practice</button></div></section>');const next=confident=>{g.answers.push({id:q.id,english:q.english,answer,suggested:q.spanish,category:q.category,confident,date:new Date().toISOString()});state.grammarAttempts.push(g.answers[g.answers.length-1]);save();g.index++;renderGrammar()};document.getElementById("grammar-yes").onclick=()=>next(true);document.getElementById("grammar-no").onclick=()=>next(false)}}
function quizPool(mode){const personal=(state.vocabulary||[]).filter(v=>v.spanish&&v.english).map(v=>[v.english,v.spanish,v.familiarity||0]);return mode==="personal"?personal:mode==="combined"?words.concat(personal):words}
function chooseQuiz(){shell("Vocabulary challenge",'<section class="card"><h2>Choose your vocabulary</h2><div class="actions"><button id="standard-quiz">Standard vocabulary</button><button id="personal-quiz">My vocabulary</button><button id="combined-quiz">Both combined</button></div><p class="muted small">Quizzes use up to five questions. Less familiar personal words appear more often, while mastered words remain in rotation.</p></section>');document.getElementById("standard-quiz").onclick=()=>startQuiz("standard");document.getElementById("personal-quiz").onclick=()=>startQuiz("personal");document.getElementById("combined-quiz").onclick=()=>startQuiz("combined")}
function normalize(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g," ")}
function weightedQuizSelection(pool,count){const remaining=[...pool],selected=[];while(remaining.length&&selected.length<count){const weights=remaining.map(w=>Math.max(1,5-(w[2]||0)*1.1)),total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total,index=0;for(;index<weights.length-1;index++){r-=weights[index];if(r<0)break}selected.push(remaining.splice(index,1)[0])}return selected}
function startQuiz(mode="standard"){const pool=quizPool(mode);if(!pool.length){showVocabulary();alert("Add some vocabulary first.");return}quiz={date:new Date().toISOString(),mode,questions:(mode==="standard"?shuffle(pool):weightedQuizSelection(pool,5)).slice(0,5).map(w=>({english:w[0],spanish:w[1],direction:Math.random()<.5?"es":"en",answer:null,correct:null})),index:0};renderQuiz()}
function updateQuizFamiliarity(q,choice){const entry=(state.vocabulary||[]).find(v=>normalize(v.spanish)===normalize(q.spanish));if(!entry)return;entry.familiarity=q.correct?(choice==="know"?4:choice==="familiar"?2:0):0;entry.lastReviewed=new Date().toISOString();save()}
function renderQuiz(){let i=quiz.index;if(i>=quiz.questions.length){state.quizzes.unshift(quiz);save();shell("Quiz complete",'<section class="card"><h2>'+quiz.questions.filter(q=>q.correct).length+' / '+quiz.questions.length+' correct</h2>'+quiz.questions.map(q=>'<div class="line"><strong>'+esc(q.direction==="es"?q.english:q.spanish.split("|")[0])+'</strong> → '+esc(q.answer)+' '+(q.correct?"✓":"✗")+'<div class="muted small">Accepted: '+esc(q.direction==="es"?q.spanish.replaceAll("|",", "):q.english)+'</div></div>').join("")+'<button id="done">Back home</button></section>');document.getElementById("done").onclick=home;return}
let q=quiz.questions[i];if(q.correct!==null){const personal=(state.vocabulary||[]).some(v=>normalize(v.spanish)===normalize(q.spanish));shell("Vocabulary challenge",'<section class="card"><span class="pill">Question '+(i+1)+' of '+quiz.questions.length+'</span><h2>'+(q.correct?"Correct!":"Not quite")+'</h2><p><strong>Your answer:</strong> '+esc(q.answer)+'</p><p><strong>Accepted:</strong> '+esc(q.direction==="es"?q.spanish.replaceAll("|",", "):q.english)+'</p>'+(personal?'<p>How well do you know this vocabulary?</p><div class="actions"><button class="secondary" data-rate="know">I know this one</button><button class="secondary" data-rate="familiar">This is familiar</button><button class="secondary" data-rate="difficult">This is difficult</button></div>'+(q.correct?'':'<p class="small muted">An incorrect answer will mark this word difficult regardless of your selection.</p>'):'<button id="next-question">Next question</button>')+'</section>');document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{updateQuizFamiliarity(q,b.dataset.rate);quiz.index++;renderQuiz()});const next=document.getElementById("next-question");if(next)next.onclick=()=>{quiz.index++;renderQuiz()};return}
shell("Vocabulary challenge",'<section class="card"><span class="pill">Question '+(i+1)+' of '+quiz.questions.length+'</span><p class="muted">Translate into '+(q.direction==="es"?"Spanish":"English")+'</p><h2>'+esc(q.direction==="es"?q.english:q.spanish.split("|")[0])+'</h2><form id="answer"><input id="translation" required autocomplete="off" placeholder="Your translation"><button>Check answer</button></form></section>');document.getElementById("answer").onsubmit=e=>{e.preventDefault();q.answer=document.getElementById("translation").value.trim();let acceptable=(q.direction==="es"?q.spanish:q.english).split("|");q.correct=acceptable.some(a=>normalize(a)===normalize(q.answer));renderQuiz()}}
function history(){shell("Your history",'<section class="card"><h2>Conversations</h2>'+(state.conversations.length?state.conversations.map((c,i)=>'<div class="line"><strong>'+new Date(c.date).toLocaleString()+'</strong><p>'+esc(c.starter?.q||c.messages?.[0]?.text||'Conversation')+'</p><button class="secondary" data-c="'+i+'">Review conversation</button></div>').join(""):'<p class="muted">No completed conversations yet.</p>')+'</section><section class="card"><h2>Quizzes</h2>'+(state.quizzes.length?state.quizzes.map((q,i)=>'<div class="line"><strong>'+new Date(q.date).toLocaleString()+'</strong> · '+q.questions.filter(x=>x.correct).length+'/5 <button class="secondary" data-q="'+i+'">Review quiz</button></div>').join(""):'<p class="muted">No quizzes yet.</p>')+'</section>');document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>reviewConversation(+b.dataset.c));document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>reviewQuiz(+b.dataset.q))}
function reviewConversation(i){let c=state.conversations[i];shell("Conversation review",'<section class="card"><p class="muted">'+new Date(c.date).toLocaleString()+'</p>'+c.messages.map(m=>'<div class="bubble '+(m.role==="user"?"user":"")+'"><strong>'+(m.role==="user"?"You":"PracticarL")+'</strong><p>'+esc(m.text)+'</p>'+(m.en?'<details><summary>English translation</summary>'+esc(m.en)+'</details>':'<p class="small muted">User translation not available yet.</p>')+'</div>').join("")+'<div class="notice">'+esc(c.feedback||"")+'</div></section>')}
function reviewQuiz(i){let q=state.quizzes[i];shell("Quiz review",'<section class="card">'+q.questions.map(x=>'<div class="line"><strong>'+esc(x.direction==="es"?x.english:x.spanish.split("|")[0])+'</strong> → '+esc(x.answer)+' '+(x.correct?"✓":"✗")+'<p class="small muted">Accepted: '+esc(x.direction==="es"?x.spanish.replaceAll("|",", "):x.english)+'</p></div>').join("")+'</section>')}
function progress(){let total=state.quizzes.reduce((n,q)=>n+q.questions.length,0),correct=state.quizzes.reduce((n,q)=>n+q.questions.filter(x=>x.correct).length,0);shell("Your progress",'<div class="grid"><section class="card"><h2>'+state.conversations.length+'</h2>Conversations completed</section><section class="card"><h2>'+state.quizzes.length+'</h2>Quizzes completed</section><section class="card"><h2>'+(total?Math.round(correct/total*100):0)+'%</h2>Vocabulary accuracy</section></div><section class="card"><h2>Your data</h2><p class="muted">Progress is stored on this browser under your username. Export it before clearing browser data.</p><div class="actions"><button id="export">Export JSON</button><button class="secondary" id="import">Import JSON</button></div><input class="hidden" type="file" id="file" accept="application/json"></section>');document.getElementById("export").onclick=()=>{let blob=new Blob([JSON.stringify({username:user,data:state},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="practicarl-"+user+".json";a.click();URL.revokeObjectURL(a.href)};document.getElementById("import").onclick=()=>document.getElementById("file").click();document.getElementById("file").onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!data.data||!Array.isArray(data.data.conversations)||!Array.isArray(data.data.quizzes))throw Error("Invalid export");if(!confirm("Replace the current username's saved progress with this import?"))return;state=data.data;save();progress()}catch(err){alert("Could not import file: "+err.message)}}}
if(user){load();home()}else login();
</script></body></html>
